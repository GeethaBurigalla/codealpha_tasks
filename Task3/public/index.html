<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectFlow - Project Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- AUTH SECTION -->
<div id="auth-section">
    <div class="auth-container">
        <h1>🗂️ ProjectFlow</h1>
        <p class="tagline">Manage your projects with ease</p>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <input type="text" id="login-username" placeholder="Username" />
            <div class="password-wrap">
    <input type="password" id="login-password" placeholder="Password" />
    <span class="show-pwd" onclick="togglePwd('login-password', this)">👁️</span>
</div>
            <button class="btn-primary" onclick="login()">Login</button>
            <p id="login-error" class="error-msg"></p>
        </div>

        <!-- Register Form -->
        <div id="register-form" style="display:none;">
            <input type="text" id="reg-username" placeholder="Username" />
            <div class="password-wrap">
    <input type="password" id="reg-password" placeholder="Password" />
    <span class="show-pwd" onclick="togglePwd('reg-password', this)">👁️</span>
</div>
            <button class="btn-primary" onclick="register()">Register</button>
            <p id="reg-error" class="error-msg"></p>
            <p id="reg-success" class="success-msg"></p>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app-section" style="display:none;">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">🗂️ <span>ProjectFlow</span></div>
        <div class="nav-center">
            <input type="text" id="search-input" placeholder="🔍 Search tasks..." oninput="searchTasks()" style="display:none;" />
        </div>
        <div class="nav-right">
            <span id="nav-username"></span>
            <button class="btn-dark-toggle" onclick="toggleDark()">🌙</button>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Projects Section -->
    <div id="projects-section" class="container">
        <div class="section-header">
            <h2>My Projects</h2>
            <button class="btn-primary" onclick="showCreateProject()">+ New Project</button>
        </div>

        <!-- Create Project Form -->
        <div id="create-project-form" style="display:none;" class="create-form">
            <input type="text" id="project-name" placeholder="Project name" />
            <input type="text" id="project-desc" placeholder="Description (optional)" />
            <div class="form-actions">
                <button class="btn-primary" onclick="createProject()">Create</button>
                <button class="btn-cancel" onclick="hideCreateProject()">Cancel</button>
            </div>
        </div>

        <div id="projects-list" class="projects-grid"></div>
    </div>

    <!-- Board Section -->
    <div id="board-section" class="container" style="display:none;">
        <div class="section-header">
            <button class="btn-back" onclick="showProjects()">← Back</button>
            <h2 id="board-title"></h2>
            <button class="btn-primary" onclick="showAddTask()">+ Add Task</button>
        </div>

        <!-- Add Task Form -->
        <div id="add-task-form" style="display:none;" class="create-form">
            <input type="text" id="task-title" placeholder="Task title" />
            <input type="text" id="task-desc" placeholder="Description (optional)" />
            <div class="form-row">
                <select id="task-priority">
                    <option value="low">🟢 Low Priority</option>
                    <option value="medium" selected>🟡 Medium Priority</option>
                    <option value="high">🔴 High Priority</option>
                </select>
                <input type="date" id="task-due" />
            </div>
            <div class="form-actions">
                <button class="btn-primary" onclick="addTask()">Add Task</button>
                <button class="btn-cancel" onclick="hideAddTask()">Cancel</button>
            </div>
        </div>

        <!-- Kanban Board -->
        <div class="kanban-board">
            <div class="kanban-column" id="col-todo">
                <div class="col-header todo-header">📋 To Do <span class="count-badge" id="count-todo">0</span></div>
                <div class="col-tasks" id="tasks-todo"
                    ondragover="allowDrop(event)"
                    ondragleave="dragLeave(event)"
                    ondrop="drop(event, 'todo')"></div>
            </div>
            <div class="kanban-column" id="col-inprogress">
                <div class="col-header inprogress-header">⚙️ In Progress <span class="count-badge" id="count-inprogress">0</span></div>
                <div class="col-tasks" id="tasks-inprogress"
                    ondragover="allowDrop(event)"
                    ondragleave="dragLeave(event)"
                    ondrop="drop(event, 'inprogress')"></div>
            </div>
            <div class="kanban-column" id="col-done">
                <div class="col-header done-header">✅ Done <span class="count-badge" id="count-done">0</span></div>
                <div class="col-tasks" id="tasks-done"
                    ondragover="allowDrop(event)"
                    ondragleave="dragLeave(event)"
                    ondrop="drop(event, 'done')"></div>
            </div>
        </div>
    </div>

</div>
<!-- Edit Task Modal -->
<div id="edit-modal" style="display:none;" class="modal-overlay">
    <div class="modal-box">
        <h3>Edit Task</h3>
        <input type="text" id="edit-title" placeholder="Task title" />
        <input type="text" id="edit-desc" placeholder="Description (optional)" />
        <div class="form-row">
            <select id="edit-priority">
                <option value="low">🟢 Low Priority</option>
                <option value="medium">🟡 Medium Priority</option>
                <option value="high">🔴 High Priority</option>
            </select>
            <input type="date" id="edit-due" />
        </div>
        <div class="form-actions">
            <button class="btn-primary" onclick="saveEdit()">Save</button>
            <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/script.js"></script>
</body>
</html>
