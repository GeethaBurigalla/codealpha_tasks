<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>

    <link rel="icon" type="image/png" href="/icon.png">

    <link rel="stylesheet" href="css/style.css">
</head>
  <body>

    <div class="navbar">
      <div class="logo"><img src="/icon.png" alt="ShopEasy" style="width:40px; height:40px; object-fit:contain; vertical-align:middle; margin-right:8px;">
  ShopEasy
</div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/cart">Cart 🛒</a>
        <a href="/orders">Orders</a>
        <div class="profile-dropdown">
          <button class="profile-btn">👤 Profile</button>
          <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/logout">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-container">

      <!-- Account Section -->
      <div class="profile-section">
        <h2>👤 Account</h2>
        <form id="accountForm">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name">
          <label>Email</label>
          <input type="email" id="email" placeholder="Your email" disabled>
          <button class="btn" type="button" onclick="saveAccount()">Save Account</button>
        </form>
      </div>

      <!-- Address Section -->
      <div class="profile-section">
        <h2>📍 Address</h2>
        <form id="addressForm">
          <label>Street</label>
          <input type="text" id="street" placeholder="Street address">
          <label>City</label>
          <input type="text" id="city" placeholder="City">
          <label>State</label>
          <input type="text" id="state" placeholder="State">
          <label>Pincode</label>
          <input type="text" id="pincode" placeholder="Pincode">
          <button class="btn" type="button" onclick="saveAddress()">Save Address</button>
        </form>
      </div>

      <!-- Language Section -->
      <div class="profile-section">
        <h2>🌐 Language</h2>
        <form id="languageForm">
          <label>Preferred Language</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Telugu">Telugu</option>
            <option value="Tamil">Tamil</option>
            <option value="Kannada">Kannada</option>
          </select>
          <button class="btn" type="button" onclick="saveLanguage()">Save Language</button>
        </form>
      </div>

      <p id="profileMessage"></p>
    </div>

    <script src="js/profile.js"></script>
  </body>
</html>
